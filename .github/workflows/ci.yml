name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gate (Fiesta)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\ci\fiesta-gate.ps1 -Mode ci

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_number }}-${{ github.sha }}
          path: |
            audit/**
            audit/fiesta/**
          if-no-files-found: warn
          retention-days: 14
