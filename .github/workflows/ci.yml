name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Optionnel mais utile sur Windows (long paths)
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Gate
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\gate.ps1

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_number }}-${{ github.sha }}
          path: audit/**
          if-no-files-found: warn
          retention-days: 14
