name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: |
          set -eo pipefail
          npm ci 2>&1 | tee ci-npm-ci.log

      - name: Typecheck
        run: |
          set -eo pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Upload typecheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-${{ github.run_number }}-${{ github.sha }}
          path: |
            ci-npm-ci.log
            ci-typecheck.log
            audit/_latest/**
            artifacts/gate*.json
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: |
          set -eo pipefail
          npm ci 2>&1 | tee ci-npm-ci.log

      - name: Vitest
        run: |
          set -eo pipefail
          npx vitest run --config ./vitest.config.ts 2>&1 | tee ci-vitest.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_number }}-${{ github.sha }}
          path: |
            ci-npm-ci.log
            ci-vitest.log
            audit/_latest/**
            artifacts/gate*.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - typecheck
      - tests
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: |
          set -eo pipefail
          npm ci 2>&1 | tee ci-npm-ci.log

      - name: Build
        run: |
          set -eo pipefail
          npm run build 2>&1 | tee ci-build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}-${{ github.sha }}
          path: |
            ci-npm-ci.log
            ci-build.log
            dist/**
            audit/_latest/**
            artifacts/gate*.json
          if-no-files-found: warn
          retention-days: 14
