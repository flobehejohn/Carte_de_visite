name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm 11
        run: |
          set -eo pipefail
          npm install -g npm@11.3.0

      - name: npm ci
        run: npm ci 2>&1 | tee ci-npm-ci.log

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Upload typecheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-${{ github.run_number }}-${{ github.sha }}
          path: |
            ci-npm-ci.log
            ci-typecheck.log

  tests:
    name: tests unit & integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Vitest
        run: npx vitest run 2>&1 | tee ci-vitest.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_number }}-${{ github.sha }}
          path: ci-vitest.log

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build 2>&1 | tee ci-build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}-${{ github.sha }}
          path: ci-build.log

  e2e-smoke:
    name: playwright e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium 2>&1 | tee ci-e2e.log
        # 🛡️ SPRINT 5.2 : Non-bloquant au début (continue-on-error)
        continue-on-error: true

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.sha }}
          path: |
            playwright-report/
            ci-e2e.log
