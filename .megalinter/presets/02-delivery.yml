# .megalinter/presets/02-delivery.yml
# Livraison / CI / docs (sans PowerShell, traité dans 06)
EXTENDS:
  - '.megalinter/presets/_base.yml'

FILTER_REGEX_INCLUDE: '^(\.github/|\.megalinter/|docs/|README\.md$|\.editorconfig$|\.gitattributes$|package\.json$|package-lock\.json$|pnpm-lock\.yaml$|yarn\.lock$|tsconfig(\.|$)|vite\.config\.|vitest\.config\.|\.eslintrc\.|\.mega-linter\.yml$)'

ENABLE_LINTERS:
  - JSON_JSONLINT
  - JSON_PRETTIER
  - YAML_YAMLLINT
  - YAML_PRETTIER
  - MARKDOWN_MARKDOWNLINT
